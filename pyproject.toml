[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sora-agent-benchmark"
version = "0.1.0"
description = "Reproducible benchmark harness for SoraAgent."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []
authors = [{ name = "SoraPlatform" }]
license = { text = "MIT" }

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
sora-bench = "sora_bench.cli:main"

[tool.setuptools.packages.find]
include = ["sora_bench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Runtime warnings/errors plus import order.  The benchmark intentionally uses
# typing.Dict/List for Python 3.9-era readability, so pyupgrade rules are not
# part of this gate.
select = ["E4", "E7", "E9", "F", "I"]
